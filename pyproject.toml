[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ot-security-probe"
version = "0.4.0"
description = "Offline-first, safety-oriented IoT/OT assessment appliance foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psutil>=6,<8",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pi-ot-probe = "pi_ot_probe.main:main"

[tool.setuptools.packages.find]
include = ["pi_ot_probe*"]

[tool.pytest.ini_options]
testpaths = ["tests", "kali_demo/tests"]
