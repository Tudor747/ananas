[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ot-security-probe"
version = "0.4.0"
description = "Offline-first, safety-oriented IoT/OT assessment appliance foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psutil>=6,<8",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
docs = [
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
]

[project.scripts]
pi-ot-probe = "pi_ot_probe.main:main"
pi-ot-local-check = "pi_ot_probe.diagnostics.local_check:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pi_ot_probe*"]

[tool.setuptools.package-data]
pi_ot_probe = ["web/static/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/js/views/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
