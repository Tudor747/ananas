[platformio]
default_envs = node_a, node_b, node_c

[env]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:build_identity.py
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -I include

[env:node_b]
build_src_filter = +<node_b.cpp>
build_flags = ${env.build_flags} -D SENTINEL_ROLE=\"B\"
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@6.6.0
    miguelbalboa/MFRC522@1.4.12

[env:node_c]
build_src_filter = +<node_c.cpp>
build_flags = ${env.build_flags} -D SENTINEL_ROLE=\"C\"
lib_deps =
    ${env.lib_deps}
    crankyoldgit/IRremoteESP8266@2.8.6

[env:node_c_ir_tx]
extends = env:node_c
build_flags = ${env:node_c.build_flags} -D SENTINEL_ENABLE_IR_TX=1

; ESP1: dual nRF24 PCB. Shares the established PCB pin map with the legacy project.
[env:node_a]
build_src_filter = +<node_a.cpp>
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -I ../BWifiKiller/include -D SENTINEL_ROLE=\"A\"
lib_deps =
    ${env.lib_deps}
    nrf24/RF24@1.6.2
