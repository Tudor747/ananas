[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

# Communication and upload speed
monitor_speed = 115200
upload_speed = 921600 

# Build configuration
upload_resetmethod = nodemcu
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

# Improved build flags
build_flags = 
    -I include
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384 ; Increase the stack for demanding tasks such as the sniffer

# Library dependencies
lib_deps =
    nrf24/RF24 @ ^1.4.7
    olikraus/U8g2 @ ^2.35.9
    marian-craciunescu/ESP32Ping @ ^1.7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    t-vk/ESP32 BLE Keyboard @ ^0.3.2

build_src_filter =
    +<*>
    -<main_ble.cpp>
    -<sentinel_main.cpp>

# USB diagnostics build uses the stock SDK. It does not require changing the
# shared libnet80211 archive to support the legacy raw-frame validation override.
[env:esp32diag]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D PIOT_KEEP_SDK_FRAME_VALIDATION

# Pi-owned menu; only headless observation code is linked into this profile.
[env:sentinel_a]
extra_scripts = pre:../firmware/build_identity.py
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<sentinel_main.cpp>
build_flags =
    -I include
    -I ../firmware/include
    -D SENTINEL_ROLE=\"A\"
lib_deps =
    nrf24/RF24@1.6.2
    bblanchon/ArduinoJson@6.21.5
